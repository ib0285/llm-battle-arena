name: Update Arena Data

on:
  schedule:
    - cron: '0 */3 * * *' # every 3 hours
  workflow_dispatch:
    inputs:
      full:
        description: 'Run a full 7-day refresh'
        required: false
        default: false
        type: boolean

# The job reads recent posts from X and commits scores.json plus the
# 7-day history, follower cache, and daily snapshots in data/.
# A full 7-day pass runs when the last one is at least 23 hours old.
# Other runs read one page per account and merge it into the stored week.
# A manual run does the same, unless "full" is checked.
# The repository setting "Workflow permissions" must allow read and write.
# TWITTERAPI_IO_KEY is a repository secret. The script sends it as X-API-Key.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test the score update
        run: python -m unittest test_update_data.py

      - name: Update scores from X
        env:
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          ARENA_FULL_REFRESH: ${{ inputs.full == true && '1' || '0' }}
        run: python update_data.py

      - name: Check scores.json
        run: python -c "import json; d=json.load(open('scores.json')); assert d.get('updatedAt'); assert isinstance(d.get('companies'), list) and d['companies']; assert isinstance(d.get('leaders'), list); assert isinstance(d.get('posts'), list); assert d.get('topPost') is None or isinstance(d.get('topPost'), dict); print('scores.json ok', len(d['companies']), 'companies', len(d['leaders']), 'leaders', len(d['posts']), 'posts')"

      - name: Commit and push if changed
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add scores.json data/history.json data/followers.json data/snapshots.json data/state.json
          if git diff --staged --quiet; then
            echo "No score file changes to save."
            exit 0
          fi
          git commit -m "Update scores [skip ci]"
          git push
